<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PNG & JPG to WebP Converter Online Free</title>

    <meta name="description"
          content="Convert PNG and JPG images to WebP online for free. Fast, secure and browser-based image conversion with no upload required.">

    <meta name="keywords"
          content="PNG to WebP, JPG to WebP, WebP converter, image converter, free image tools">

    <meta name="robots"
          content="index,follow,max-image-preview:large">

    <meta name="theme-color"
          content="#020617">

    <link rel="canonical"
          href="https://yourdomain.com/">

    <link rel="stylesheet"
          href="style.css?v=1.0">

</head>

<body>

    <div class="container">

        <div class="langbar">

            <select id="langSelect">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="ru">Русский</option>
                <option value="ar">العربية</option>
            </select>

        </div>

        <div class="main-card">

            <h1 id="title">
                JPG / PNG → WebP Converter
            </h1>

            <p id="subtitle"
               class="subtitle">
                Convert PNG and JPG images to WebP instantly in your browser.
                No uploads, no waiting, completely free.
            </p>

            <div id="dropzone"
                 class="dropzone">

                <p id="droptext">
                    📁 Drag & Drop Image Here
                </p>

                <p id="ortext">
                    or
                </p>

                <input
                    type="file"
                    id="fileInput"
                    accept=".jpg,.jpeg,.png"
                    hidden>

                <button id="selectBtn">
                    Choose Image
                </button>

                <p>
                    Maximum file size: 8 MB
                </p>

            </div>

            <div id="previewSection"
                 class="hidden preview-wrap">

                <div class="preview-box">

                    <img
                        id="preview"
                        alt="Image Preview">

                </div>

                <div class="side">

                    <div class="info-card">

                        <div id="fileInfo"></div>

                    </div>

                    <div
                        id="webpInfo"
                        class="info-card hidden">
                    </div>

                    <div
                        id="savedInfo"
                        class="info-card hidden">
                    </div>

                    <button id="convertBtn">
                        Convert to WebP
                    </button>

                    <a
                        id="downloadBtn"
                        class="hidden"
                        download="converted.webp">
                        Download WebP
                    </a>

                </div>

            </div>

        </div>

        <footer>

            <p>
                © 2026 WebP Converter Pro.
                Fast browser-based image conversion.
            </p>

        </footer>

    </div>

    <script src="script.js?v=1.0"></script>

</body>

</html>
